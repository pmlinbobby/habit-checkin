<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习惯打卡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #f5f5f5; padding: 16px; color: #333; max-width: 480px; margin: 0 auto; }
.card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
h1 { text-align: center; font-size: 24px; margin-bottom: 4px; }
.subtitle { text-align: center; color: #999; font-size: 14px; margin-bottom: 20px; }

/* 事件切换 */
.event-switch { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
.event-chip { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; background: #eee; font-size: 14px; cursor: pointer; white-space: nowrap; border: 2px solid transparent; }
.event-chip.active { background: #4CAF50; color: #fff; }
.event-chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.event-chip.done-chip { opacity: .5; }

/* 统计 */
.stats { display: flex; justify-content: space-around; text-align: center; margin: 16px 0; }
.stats .num { font-size: 30px; font-weight: bold; color: #4CAF50; }
.stats .label { font-size: 12px; color: #999; margin-top: 4px; }
.cycle-tag { text-align: center; font-size: 13px; color: #999; margin-bottom: 12px; }

/* 按钮 */
.btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin: 12px 0; }
.btn-primary { background: linear-gradient(135deg, #4CAF50, #45a049); color: #fff; }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: #fff; }
.btn-danger:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary { background: #fff; color: #4CAF50; border: 2px solid #4CAF50; }
.btn-sm { padding: 8px 16px; font-size: 14px; }
.btn-completed { background: linear-gradient(135deg, #9e9e9e, #757575); color: #fff; }

/* 通用 */
.section-title { font-size: 18px; font-weight: bold; margin: 20px 0 12px; }
.item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
.item:last-child { border-bottom: none; }
.item-info { flex: 1; }
.item-name { font-weight: 500; }
.item-points { font-size: 13px; color: #4CAF50; margin-top: 2px; }
.btn-small { padding: 6px 14px; border-radius: 8px; font-size: 13px; border: none; cursor: pointer; }
.btn-redeem { color: #fff; }
.btn-redeem:disabled { background: #ccc; }
.btn-delete { background: #ff4757; color: #fff; }
.empty { text-align: center; color: #bbb; padding: 30px 0; font-size: 14px; }
input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 10px; }
.tabs { display: flex; gap: 10px; margin-bottom: 16px; }
.tab { flex: 1; text-align: center; padding: 10px; border-radius: 10px; background: #eee; font-size: 14px; cursor: pointer; }
.tab.active { background: #4CAF50; color: #fff; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.8); color: #fff; padding: 14px 28px; border-radius: 10px; font-size: 15px; z-index: 999; display: none; text-align: center; line-height: 1.6; }
.fail-banner { background: linear-gradient(135deg, #fff3cd, #ffeaa7); border-radius: 12px; padding: 14px; margin: 12px 0; text-align: center; font-size: 14px; color: #856404; }
.done-banner { background: linear-gradient(135deg, #d4edda, #c3e6cb); border-radius: 12px; padding: 14px; margin: 12px 0; text-align: center; font-size: 14px; color: #155724; }
.modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 100; display: none; align-items: center; justify-content: center; }
.modal { background: #fff; border-radius: 16px; padding: 24px; width: 85%; max-width: 340px; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-bottom: 16px; text-align: center; }
.color-picker { display: flex; gap: 10px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
.color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
.color-dot.selected { border-color: #333; }
.type-options { display: flex; gap: 10px; margin: 12px 0; }
.type-opt { flex: 1; text-align: center; padding: 14px 8px; border: 2px solid #eee; border-radius: 12px; cursor: pointer; font-size: 14px; }
.type-opt.selected { border-color: #4CAF50; background: #f0faf0; }
.type-opt .type-emoji { font-size: 24px; display: block; margin-bottom: 4px; }
.cycle-options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.cycle-opt { display: flex; align-items: center; padding: 12px; border: 2px solid #eee; border-radius: 10px; cursor: pointer; font-size: 15px; }
.cycle-opt.selected { border-color: #4CAF50; background: #f0faf0; }
.cycle-opt input[type="radio"] { margin-right: 10px; }
.cycle-custom { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.cycle-custom input { margin: 0; width: 70px; text-align: center; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<h1>🔥 习惯打卡</h1>
<p class="subtitle">坚持每一天，兑换你想要的奖励</p>

<!-- 事件切换 -->
<div class="event-switch" id="eventSwitch"></div>

<div class="card">
  <div style="text-align:center;margin-bottom:4px;">
    <span id="currentEventEmoji" style="font-size:22px;"></span>
    <span id="currentEventName" style="font-size:18px;font-weight:bold;"></span>
  </div>
  <div class="cycle-tag" id="cycleTag"></div>
  <div class="stats">
    <div><div class="num" id="streak">0</div><div class="label" id="streakLabel">连续周期</div></div>
    <div><div class="num" id="totalDays">0</div><div class="label" id="totalLabel">完成次数</div></div>
    <div><div class="num" id="points">0</div><div class="label">积分</div></div>
  </div>

  <div id="failBanner" class="fail-banner" style="display:none;"></div>
  <div id="doneBanner" class="done-banner" style="display:none;"></div>

  <button class="btn btn-primary" id="checkInBtn" onclick="checkIn()"></button>
  <button class="btn btn-danger" id="failBtn" onclick="failToday()"></button>

  <p id="checkInStatus" style="text-align:center;color:#999;font-size:13px;margin-top:8px;"></p>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('wish')">🎁 许愿池</div>
  <div class="tab" onclick="switchTab('records')">📋 打卡记录</div>
  <div class="tab" onclick="switchTab('events')">⚙️ 事件管理</div>
  <div class="tab" onclick="switchTab('manage')">🏷️ 商品管理</div>
</div>

<!-- 许愿池 -->
<div class="tab-content active" id="tab-wish">
  <div class="section-title">选择奖励兑换</div>
  <div id="wishList"></div>
</div>

<!-- 打卡记录 -->
<div class="tab-content" id="tab-records">
  <div class="section-title">打卡记录</div>
  <div id="recordsList"></div>
</div>

<!-- 事件管理 -->
<div class="tab-content" id="tab-events">
  <div class="section-title">我的事件</div>
  <div id="eventsList"></div>
  <button class="btn btn-secondary btn-sm" onclick="openEventModal()">+ 新建事件</button>
</div>

<!-- 商品管理 -->
<div class="tab-content" id="tab-manage">
  <div class="section-title">添加新商品</div>
  <input id="newName" placeholder="商品名称，如：一杯奶茶">
  <input id="newPoints" type="number" placeholder="所需积分，如：200">
  <button class="btn btn-secondary" onclick="addItem()">+ 添加商品</button>
  <div class="section-title" style="margin-top:24px;">已有商品</div>
  <div id="manageList"></div>
</div>

<script>
// ========== 常量 ==========
const COLORS = ['#4CAF50','#2196F3','#FF9800','#9C27B0','#E91E63','#00BCD4'];
const EMOJIS = ['🚭','💪','📚','🏃','💧','🧘','💤','🥗','🎯','✍️','🏊','🎸','🧩','🚴'];

const STORE_KEY = 'habit_tracker_data';
let data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
let currentEventId = null;

if (!data) {
  const defaultEvent = {
    id: Date.now(),
    name: '戒烟',
    emoji: '🚭',
    color: '#4CAF50',
    reward: 20,
    penalty: 17,
    type: 'repeat',      // 'repeat' = 重复, 'once' = 一次性
    cycle: 1,
    streak: 0,
    totalDone: 0,
    points: 0,
    completed: false,    // 一次性事件是否已完成
    lastCheckIn: null,
    lastFail: null,
    history: []
  };
  data = {
    events: [defaultEvent],
    items: [
      { id: 1, name: '一杯奶茶', points: 200 },
      { id: 2, name: '一包零食', points: 100 },
      { id: 3, name: '电影票', points: 500 },
    ],
    records: []
  };
  currentEventId = defaultEvent.id;
  save();
} else if (!currentEventId && data.events.length) {
  currentEventId = data.events[0].id;
}

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
function cur() { return data.events.find(e => e.id === currentEventId); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function daysDiff(a, b) {
  const d1 = new Date(a + 'T00:00:00');
  const d2 = new Date(b + 'T00:00:00');
  return Math.floor((d2 - d1) / 86400000);
}

// ========== 打卡 ==========
function checkIn() {
  const e = cur();
  const today = todayStr();

  if (e.type === 'once') {
    // 一次性事件
    if (e.completed) { showToast('这个事件已经完成了 🎉'); return; }
    e.completed = true;
    e.totalDone = 1;
    e.points += e.reward;
    e.lastCheckIn = today;
    e.history.unshift({ date: today, type: 'checkin' });
    save();
    updateUI();
    showToast(`🎉 完成！+${e.reward} 积分<br>干得漂亮！`);
    return;
  }

  // 重复事件
  if (e.lastCheckIn === today) { showToast('今天已经打卡啦 🎉<br>下次再来！'); return; }
  if (e.lastFail === today) { showToast('今天已经记录失败<br>下次继续加油 💪'); return; }

  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (e.lastCheckIn === yesterday) e.streak++;
  else e.streak = 1;

  e.totalDone++;
  e.points += e.reward;
  e.lastCheckIn = today;
  e.history.unshift({ date: today, type: 'checkin' });
  save();
  updateUI();
  showToast(`打卡成功！+${e.reward} 积分 🔥<br>继续保持！`);
}

// ========== 失败 ==========
function failToday() {
  const e = cur();
  const today = todayStr();

  if (e.type === 'once') {
    // 一次性事件失败
    if (e.completed) { showToast('这个事件已经完成了'); return; }
    if (e.lastFail === today) { showToast('今天已经记录过了'); return; }
    e.points = Math.max(0, e.points - e.penalty);
    e.lastFail = today;
    e.history.unshift({ date: today, type: 'fail' });
    save();
    updateUI();
    showToast(`已记录，扣除 ${e.penalty} 积分<br>没关系，再试一次 💪`);
    return;
  }

  // 重复事件失败
  if (e.lastFail === today) { showToast('今天已经记录过了<br>别灰心，明天重新开始 💪'); return; }
  e.points = Math.max(0, e.points - e.penalty);
  e.streak = 0;
  e.lastFail = today;
  e.history.unshift({ date: today, type: 'fail' });
  save();
  updateUI();
  showToast(`已记录，扣除 ${e.penalty} 积分<br>没关系，明天又是新的一天 🌅`);
}

// ========== 兑换 ==========
function redeem(id) {
  const e = cur();
  const item = data.items.find(i => i.id === id);
  if (!item) return;
  if (e.points < item.points) { showToast('积分不够哦，再坚持几天！💪'); return; }
  e.points -= item.points;
  data.records.unshift({ id: Date.now(), eventId: e.id, eventName: e.name, itemName: item.name, points: item.points, date: todayStr() });
  save();
  updateUI();
  showToast(`兑换成功！去享受你的${item.name}吧 🎉`);
}

// ========== 事件管理 ==========
function openEventModal(ev) {
  const isEdit = !!ev;
  const e = ev || { name: '', emoji: '💪', color: '#4CAF50', reward: 20, penalty: 17, type: 'repeat', cycle: 1 };
  window._editingType = e.type;
  window._editingCycle = e.cycle;
  window._editingEmoji = e.emoji;
  window._editingColor = e.color;

  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3>${isEdit ? '编辑事件' : '新建事件'}</h3>
    <input id="evName" placeholder="事件名称，如：戒烟" value="${e.name}">

    <div style="text-align:center;margin:12px 0 4px;font-size:14px;font-weight:bold;">事件类型</div>
    <div class="type-options">
      <div class="type-opt ${e.type==='repeat'?'selected':''}" onclick="selectType('repeat',this)">
        <span class="type-emoji">🔄</span>重复事件
      </div>
      <div class="type-opt ${e.type==='once'?'selected':''}" onclick="selectType('once',this)">
        <span class="type-emoji">🎯</span>一次性
      </div>
    </div>

    <div id="cycleSection" style="${e.type==='once'?'display:none':''}">
      <div style="text-align:center;margin:12px 0 4px;font-size:14px;font-weight:bold;">打卡周期</div>
      <div class="cycle-options" id="cycleOptions">
        ${[1,2,3].map(c => `<label class="cycle-opt ${c===e.cycle?'selected':''}" onclick="selectCycle(this,${c})">
          <input type="radio" name="cycle" ${c===e.cycle?'checked':''}> ${c===1?'每天打卡':'每 '+c+' 天打卡一次'}
        </label>`).join('')}
        <div class="cycle-custom">
          <span style="font-size:14px;color:#666;">每</span>
          <input type="number" id="evCycleCustom" min="4" max="30" value="${e.cycle>3?e.cycle:4}" oninput="selectCustomCycle(this)">
          <span style="font-size:14px;color:#666;">天打卡一次</span>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin:12px 0 4px;font-size:14px;font-weight:bold;">外观</div>
    <div class="color-picker">
      ${EMOJIS.map(em => `<span style="font-size:24px;cursor:pointer;padding:4px;border-radius:8px;${em===e.emoji?'background:#eee':''}" onclick="selectEmoji('${em}',this)">${em}</span>`).join('')}
    </div>
    <div class="color-picker">
      ${COLORS.map(c => `<div class="color-dot ${c===e.color?'selected':''}" style="background:${c}" onclick="selectColor('${c}',this)"></div>`).join('')}
    </div>

    <input id="evReward" type="number" placeholder="完成获得积分" value="${e.reward}">
    <input id="evPenalty" type="number" placeholder="失败扣除积分" value="${e.penalty}">
    <button class="btn btn-primary" onclick="saveEvent(${e.id || 'null'}, ${isEdit})">${isEdit ? '保存修改' : '创建事件'}</button>
    ${isEdit ? `<button class="btn btn-danger btn-sm" onclick="deleteEvent(${e.id})" style="margin-top:8px;">删除该事件</button>` : ''}
  `;
  document.getElementById('modalMask').style.display = 'flex';
}

function selectType(type, el) {
  window._editingType = type;
  document.querySelectorAll('.type-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('cycleSection').style.display = type === 'once' ? 'none' : 'block';
}

function selectEmoji(em, el) {
  window._editingEmoji = em;
  document.querySelectorAll('.modal .color-picker:first-of-type span').forEach(s => s.style.background = '');
  el.style.background = '#eee';
}
function selectColor(c, el) {
  window._editingColor = c;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
}
function selectCycle(el, cycle) {
  window._editingCycle = cycle;
  document.querySelectorAll('.cycle-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}
function selectCustomCycle(input) {
  let v = parseInt(input.value);
  if (v < 4) v = 4; if (v > 30) v = 30;
  window._editingCycle = v;
  document.querySelectorAll('.cycle-opt').forEach(o => o.classList.remove('selected'));
}

function saveEvent(id, isEdit) {
  const name = document.getElementById('evName').value.trim();
  const reward = parseInt(document.getElementById('evReward').value) || 0;
  const penalty = parseInt(document.getElementById('evPenalty').value) || 0;
  if (!name) { showToast('请填写事件名称'); return; }

  if (isEdit) {
    const e = data.events.find(x => x.id === id);
    e.name = name; e.emoji = window._editingEmoji; e.color = window._editingColor;
    e.reward = reward; e.penalty = penalty; e.type = window._editingType;
    if (window._editingType === 'repeat') e.cycle = window._editingCycle;
    showToast('修改成功 ✅');
  } else {
    const newEv = {
      id: Date.now(), name, emoji: window._editingEmoji, color: window._editingColor,
      reward, penalty, type: window._editingType,
      cycle: window._editingType === 'repeat' ? window._editingCycle : 0,
      streak: 0, totalDone: 0, points: 0, completed: false,
      lastCheckIn: null, lastFail: null, history: []
    };
    data.events.push(newEv);
    showToast('事件创建成功 ✅');
  }
  closeModal();
  save();
  updateUI();
}

function deleteEvent(id) {
  if (data.events.length <= 1) { showToast('至少保留一个事件'); return; }
  if (!confirm('确定删除该事件？所有记录也会一并删除')) return;
  data.events = data.events.filter(x => x.id !== id);
  currentEventId = data.events[0].id;
  closeModal();
  save();
  updateUI();
}

function switchEvent(id) {
  currentEventId = id;
  save();
  updateUI();
}

// ========== 商品管理 ==========
function addItem() {
  const name = document.getElementById('newName').value.trim();
  const points = parseInt(document.getElementById('newPoints').value);
  if (!name || !points) { showToast('请填写完整信息'); return; }
  data.items.push({ id: Date.now(), name, points });
  document.getElementById('newName').value = '';
  document.getElementById('newPoints').value = '';
  save(); updateUI();
  showToast('商品添加成功 ✅');
}
function deleteItem(id) {
  data.items = data.items.filter(i => i.id !== id);
  save(); updateUI();
}
function closeModal() { document.getElementById('modalMask').style.display = 'none'; }

// ========== UI ==========
function updateUI() {
  const e = cur();
  if (!e) return;

  // 事件切换条
  document.getElementById('eventSwitch').innerHTML = data.events.map(ev => `
    <div class="event-chip ${ev.id===currentEventId?'active':''} ${ev.completed?'done-chip':''}" onclick="switchEvent(${ev.id})">
      <span class="dot" style="background:${ev.color}"></span>${ev.emoji} ${ev.name} ${ev.completed?'✅':''}
    </div>
  `).join('');

  // 当前事件信息
  document.getElementById('currentEventEmoji').textContent = e.emoji;
  document.getElementById('currentEventName').textContent = e.name;

  if (e.type === 'once') {
    document.getElementById('cycleTag').textContent = '🎯 一次性任务';
    document.getElementById('streakLabel').textContent = '—';
    document.getElementById('totalLabel').textContent = e.completed ? '已完成' : '状态';
    document.getElementById('streak').textContent = '—';
    document.getElementById('totalDays').textContent = e.completed ? '✅' : '⏳';
  } else {
    document.getElementById('cycleTag').textContent = `📅 周期：${e.cycle===1?'每天':`每 ${e.cycle} 天`}打卡一次`;
    document.getElementById('streakLabel').textContent = '连续次数';
    document.getElementById('totalLabel').textContent = '完成次数';
    document.getElementById('streak').textContent = e.streak;
    document.getElementById('totalDays').textContent = e.totalDone;
  }

  document.getElementById('points').textContent = e.points;

  // 按钮
  const checkBtn = document.getElementById('checkInBtn');
  const failBtn = document.getElementById('failBtn');

  if (e.type === 'once') {
    if (e.completed) {
      checkBtn.disabled = true; failBtn.disabled = true;
      checkBtn.textContent = '✅ 已完成';
      failBtn.textContent = '—';
      failBtn.style.display = 'none';
    } else {
      failBtn.style.display = 'block';
      checkBtn.disabled = false; failBtn.disabled = false;
      checkBtn.textContent = `🎯 标记完成 +${e.reward} 积分`;
      failBtn.textContent = `❌ 未完成 -${e.penalty} 积分`;
    }
  } else {
    failBtn.style.display = 'block';
    checkBtn.textContent = `✅ 打卡 +${e.reward} 积分`;
    failBtn.textContent = `❌ 失败 -${e.penalty} 积分`;
    const today = todayStr();
    if (e.lastCheckIn === today || e.lastFail === today) {
      checkBtn.disabled = true; failBtn.disabled = true;
      checkBtn.textContent = '✅ 今日已处理';
      failBtn.textContent = '❌ 今日已处理';
    } else {
      checkBtn.disabled = false; failBtn.disabled = false;
    }
  }

  // 横幅
  const failBanner = document.getElementById('failBanner');
  const doneBanner = document.getElementById('doneBanner');
  if (e.type === 'once' && e.completed) {
    failBanner.style.display = 'none';
    doneBanner.style.display = 'block';
    doneBanner.textContent = `🎉 任务完成！获得了 ${e.reward} 积分，辛苦了！`;
  } else if (e.lastFail === todayStr() && e.type === 'repeat') {
    failBanner.style.display = 'block';
    doneBanner.style.display = 'none';
    failBanner.textContent = `💪 上次没做到，但明天又是新的一天！连续天数已重置，加油！`;
  } else {
    failBanner.style.display = 'none';
    doneBanner.style.display = 'none';
  }

  // 状态提示
  if (e.type === 'repeat') {
    if (e.lastCheckIn) {
      document.getElementById('checkInStatus').textContent = `上次打卡：${e.lastCheckIn}`;
    } else {
      document.getElementById('checkInStatus').textContent = '还没有打卡记录，今天开始吧！';
    }
  } else {
    if (e.completed) {
      document.getElementById('checkInStatus').textContent = `完成于：${e.lastCheckIn || '—'}`;
    } else {
      document.getElementById('checkInStatus').textContent = '加油，完成它！';
    }
  }

  // 许愿池
  document.getElementById('wishList').innerHTML = data.items.length
    ? data.items.map(i => `
      <div class="item">
        <div class="item-info">
          <div class="item-name">${i.name}</div>
          <div class="item-points" style="color:${e.color}">🪙 ${i.points} 积分</div>
        </div>
        <button class="btn-small btn-redeem" style="background:${e.color}" ${e.points < i.points ? 'disabled' : ''} onclick="redeem(${i.id})">兑换</button>
      </div>`).join('')
    : '<div class="empty">许愿池空空如也，去添加商品吧</div>';

  // 记录
  document.getElementById('recordsList').innerHTML = e.history.length
    ? e.history.map(h => `
      <div class="item">
        <div class="item-info">
          <div class="item-name">${h.type==='checkin'?'✅ '+(e.type==='once'?'任务完成':'打卡成功'):'❌ 未完成'}</div>
          <div class="item-points">📅 ${h.date} ${h.type==='checkin'?`+${e.reward}`:`-${e.penalty}`} 积分</div>
        </div>
      </div>`).join('')
    : '<div class="empty">还没有记录</div>';

  // 事件列表
  document.getElementById('eventsList').innerHTML = data.events.map(ev => `
    <div class="item">
      <div class="item-info">
        <div class="item-name"><span style="color:${ev.color}">${ev.emoji}</span> ${ev.name} ${ev.completed?'✅':''}</div>
        <div class="item-points">${ev.type==='once'?'🎯 一次性':'🔄 每'+ev.cycle+'天'} · +${ev.reward} / -${ev.penalty} · ${ev.points}积分</div>
      </div>
      <button class="btn-small" style="background:#eee;" onclick='openEventModal(${JSON.stringify(ev).replace(/'/g,"&#39;")})'>编辑</button>
    </div>`).join('');

  // 商品管理
  document.getElementById('manageList').innerHTML = data.items.length
    ? data.items.map(i => `
      <div class="item">
        <div class="item-info"><div class="item-name">${i.name}</div><div class="item-points">🪙 ${i.points} 积分</div></div>
        <button class="btn-small btn-delete" onclick="deleteItem(${i.id})">删除</button>
      </div>`).join('')
    : '<div class="empty">暂无商品</div>';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['wish','records','events','manage'][i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

updateUI();
</script>
</body>
</html>
